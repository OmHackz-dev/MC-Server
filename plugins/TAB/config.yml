header-footer:
  enabled: true
  designs:
    default:
      display-condition: '%world%!=disabledworld'
      header:
      - '&#2AFF00&l☠ MANGO ANARCHY ☠'
      - '&7No Rules ⚔ No Resets ☣ Pure Chaos'
      - '&7&m----------------------------------'
      footer:
      - '&7&m----------------------------------'
      - '&#2AFF00🌐 Website: &fmango-anarchy.ct.ws'
      - '&#2AFF00🛒 Store: &fmango-anarchy.ct.ws/store'
      - '&#2AFF00💬 Discord: &fmango-anarchy.ct.ws/discord'
      - '&#2AFF00☎ Ping: &f%ping%ms &7| &#2AFF00⌛ Online: &f%online%'
tablist-name-formatting:
  enabled: true
scoreboard-teams:
  enabled: true
  enable-collision: true
  sorting-types:
  - GROUPS:owner,admin,mod,helper,vip,default
  - PLACEHOLDER_A_TO_Z:%player%
scoreboard:
  enabled: true
  toggle-command: /sb
  hidden-by-default: false
  use-numbers: false
  scoreboards:
    default:
      title: '&#2AFF00&l❱❱ MANGO ANARCHY ❰❰'
      lines:
      - '&7&m--------------------'
      - '&#2AFF00☺ Player: &f%player_name%'
      - '&#2AFF00♠ Rank: &f%vault_prefix%'
      - '&#2AFF00$ Balance: &f₹%vault_eco_balance_formatted%'
      - ''
      - '&#2AFF00⚔ Stats:'
      - ' &fKills: %statistic_player_kills%'
      - ' &fDeaths: %statistic_deaths%'
      - ' &fPing: %ping%ms'
      - '&7&m--------------------'
      - '&#2AFF00mango-anarchy.ct.ws'
bossbar:
  enabled: true
  toggle-command: /bossbar
  hidden-by-default: false
  bars:
    MangoBar:
      style: PROGRESS
      color: GREEN
      progress: '100'
      text: '&#2AFF00Mango Anarchy ☠ | Visit Store & Discord'
placeholders:
  time-format: HH:mm:ss
  register-tab-expansion: false
mysql:
  enabled: false
debug: false
prevent-spectator-effect:
  enabled: false
use-online-uuid-in-tablist: true
permission-refresh-interval: 1000
proxy-support:
  enabled: true
  type: PLUGIN
  plugin:
    name: RedisBungee
compensate-for-packetevents-bug: false
assign-groups-by-permissions: false
primary-group-finding-list:
- Owner
- Admin
- Helper
- default
belowname-objective:
  fancy-value-default: NPC
  fancy-value: '&c%health%'
  enabled: false
global-playerlist:
  update-latency: false
  enabled: false
placeholder-refresh-intervals:
  default-refresh-interval: 500
  '%player_ping%': 1000
  '%vault_prefix%': 1000
playerlist-objective:
  title: TAB
  value: ''
  render-type: INTEGER
  enabled: true
config-version: 2
components:
  minimessage-support: true
  disable-shadow-for-heads: true
layout:
  enabled: false
per-world-playerlist:
  enabled: false
ping-spoof:
  enabled: false
